spring.application.name=learningservice

# =============================================================================
# DATABASE
# =============================================================================
spring.datasource.url=${LEARNING_DB_URL:jdbc:mysql://localhost:3306/ai_english_learning?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${LEARNING_DB_USERNAME:${APP_DB_USERNAME:root}}
spring.datasource.password=${LEARNING_DB_PASSWORD:${APP_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# HIKARICP CONNECTION POOL
# =============================================================================
spring.datasource.hikari.maximum-pool-size=${LEARNING_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${LEARNING_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${LEARNING_DB_POOL_TIMEOUT:10000}
spring.datasource.hikari.idle-timeout=${LEARNING_DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${LEARNING_DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${LEARNING_DB_POOL_KEEPALIVE:180000}
spring.datasource.hikari.validation-timeout=${LEARNING_DB_VALIDATION_TIMEOUT:2000}
spring.datasource.hikari.leak-detection-threshold=${LEARNING_DB_LEAK_DETECTION_MS:30000}

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=${LEARNING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${LEARNING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.default_batch_fetch_size=${LEARNING_JPA_BATCH_FETCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.transaction.default-timeout=${LEARNING_TX_TIMEOUT_SECONDS:15}

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=${LEARNING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=${LEARNING_FLYWAY_REPAIR:false}

# =============================================================================
# JWT
# =============================================================================
app.jwt.secret=${APP_JWT_SECRET:dev_only_replace_with_64_byte_secret_dev_only_replace_with_64_byte_secret}

# =============================================================================
# SERVER
# =============================================================================
server.port=${LEARNING_SERVER_PORT:8081}
server.tomcat.threads.max=${LEARNING_TOMCAT_THREADS:40}
server.tomcat.threads.min-spare=${LEARNING_TOMCAT_MIN_THREADS:8}
server.tomcat.accept-count=${LEARNING_TOMCAT_ACCEPT:100}
server.tomcat.max-connections=${LEARNING_TOMCAT_MAX_CONN:200}

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=${LEARNING_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# =============================================================================
# CACHE / REDIS
# =============================================================================
spring.cache.type=${LEARNING_CACHE_TYPE:simple}
spring.data.redis.host=${LEARNING_REDIS_HOST:localhost}
spring.data.redis.port=${LEARNING_REDIS_PORT:6379}
spring.data.redis.password=${LEARNING_REDIS_PASSWORD:${APP_REDIS_PASSWORD:}}
spring.data.redis.timeout=${LEARNING_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.health.redis.enabled=${LEARNING_REDIS_HEALTH_ENABLED:false}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# =============================================================================
# MISC
# =============================================================================
spring.mvc.problemdetails.enabled=true
logging.level.com.ai.learningservice=INFO
logging.level.org.springframework.security=WARN

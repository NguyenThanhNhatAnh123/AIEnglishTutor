services:
  mysql:
    image: mysql:8.0
    profiles: ["docker-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${APP_DB_NAME:-ai_english_exam}
      MYSQL_USER: ${APP_DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=250
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_DB_URL: ${APP_DB_URL:-jdbc:mysql://host.docker.internal:${APP_DB_PORT:-3306}/${APP_DB_NAME:-ai_english_exam}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-root}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev_only_replace_with_64_byte_secret_dev_only_replace_with_64_byte_secret}
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      APP_FLYWAY_ENABLED: "true"
      APP_JPA_DDL_AUTO: validate
      APP_DB_POOL_MAX: "30"
      APP_DB_POOL_MIN_IDLE: "10"
      APP_DB_POOL_TIMEOUT: "10000"
      APP_DB_POOL_KEEPALIVE: "180000"
      APP_DB_VALIDATION_TIMEOUT: "2000"
      APP_JPA_BATCH_SIZE: "100"
      APP_TX_TIMEOUT_SECONDS: "30"
      APP_TOMCAT_THREADS: "100"
      APP_TOMCAT_ACCEPT: "200"
      APP_TOMCAT_MAX_CONN: "500"
      APP_MANAGEMENT_EXPOSURE: health,info,metrics,prometheus
      APP_RATE_LIMIT_BACKEND: redis
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-redis_password_change_me}
      APP_AI_LOCAL_URL: http://aiservice:8002
      APP_AI_LOCAL_OCR_URL: http://aiservice:8002
      APP_AI_LOCAL_TTS_URL: http://aiservice:8002
      APP_AI_LOCAL_TRANSCRIBE_URL: http://aiservice:8002
      APP_AI_TOTAL_TIMEOUT: "170"
      APP_REDIS_TIMEOUT: "1s"
    depends_on:
      redis:
        condition: service_healthy
      aiservice:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  aiservice:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_PRELOAD: "1"
      OCR_ENGINE: tesseract
      OCR_MAX_PDF_PAGES: "20"
      OCR_ALLOW_TESSERACT_FALLBACK: "1"
      TESS_LANG: eng
    ports:
      - "8002:8002"
    volumes:
      - aiservice_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
  prometheus_data:
  redis_data:
  aiservice_cache:

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${APP_DB_NAME:-ai_english_exam}
      MYSQL_USER: ${APP_DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./learningservice/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=250
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_DB_URL: ${APP_DB_URL:-jdbc:mysql://mysql:3306/${APP_DB_NAME:-ai_english_exam}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-root}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-root_password}
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      APP_FLYWAY_ENABLED: "true"
      APP_JPA_DDL_AUTO: validate
      APP_DB_POOL_MAX: "30"
      APP_DB_POOL_MIN_IDLE: "10"
      APP_DB_POOL_TIMEOUT: "10000"
      APP_DB_POOL_KEEPALIVE: "180000"
      APP_DB_VALIDATION_TIMEOUT: "2000"
      APP_JPA_BATCH_SIZE: "100"
      APP_TX_TIMEOUT_SECONDS: "30"
      APP_TOMCAT_THREADS: "100"
      APP_TOMCAT_ACCEPT: "200"
      APP_TOMCAT_MAX_CONN: "500"
      APP_MANAGEMENT_EXPOSURE: health,info,metrics,prometheus
      APP_RATE_LIMIT_BACKEND: redis
      APP_RATE_LIMIT_BYPASS_ROLES: TEACHER
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_AI_LOCAL_URL: http://aiservice:8002
      APP_AI_LOCAL_OCR_URL: http://aiservice:8002
      APP_AI_LOCAL_TTS_URL: http://aiservice:8002
      APP_AI_LOCAL_TRANSCRIBE_URL: http://aiservice:8002
      APP_AI_TOTAL_TIMEOUT: "170"
      APP_AI_MAX_CONCURRENT_REQUESTS: "8"
      APP_REDIS_TIMEOUT: "1s"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      aiservice:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      learningservice:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      learningservice:
        condition: service_healthy
    ports:
      - "9090:9090"

  learningservice:
    build:
      context: ./learningservice
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LEARNING_DB_URL: ${LEARNING_DB_URL:-jdbc:mysql://mysql:3306/${LEARNING_DB_NAME:-ai_english_learning}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      LEARNING_DB_USERNAME: ${LEARNING_DB_USERNAME:-root}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD:-root_password}
      LEARNING_SERVER_PORT: "8081"
      LEARNING_CORS_ALLOWED_ORIGINS: ${LEARNING_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      LEARNING_FLYWAY_ENABLED: "true"
      LEARNING_JPA_DDL_AUTO: validate
      LEARNING_CACHE_TYPE: redis
      LEARNING_CACHE_VOCABULARY_TTL_SECONDS: "1800"
      LEARNING_REDIS_HOST: redis
      LEARNING_REDIS_PORT: "6379"
      LEARNING_REDIS_TIMEOUT: "1s"
      LEARNING_REDIS_HEALTH_ENABLED: "true"
      LEARNING_DB_POOL_MAX: "20"
      LEARNING_DB_POOL_MIN_IDLE: "5"
      LEARNING_DB_POOL_TIMEOUT: "10000"
      LEARNING_DB_POOL_KEEPALIVE: "180000"
      LEARNING_DB_VALIDATION_TIMEOUT: "2000"
      LEARNING_JPA_BATCH_SIZE: "50"
      LEARNING_TX_TIMEOUT_SECONDS: "15"
      LEARNING_TOMCAT_THREADS: "60"
      LEARNING_TOMCAT_ACCEPT: "120"
      LEARNING_TOMCAT_MAX_CONN: "300"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "set -a && . /run/aienglishtutor/backend.env && set +a && : \"$${APP_REDIS_PASSWORD:?Set APP_REDIS_PASSWORD in backend/.env}\" && redis-server --appendonly yes --requirepass \"$${APP_REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
      - ./backend/.env:/run/aienglishtutor/backend.env:ro
    healthcheck:
      test: ["CMD-SHELL", "set -a && . /run/aienglishtutor/backend.env && set +a && redis-cli -a \"$${APP_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  aiservice:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_PRELOAD: "1"
      OCR_ENGINE: tesseract
      OCR_MAX_PDF_PAGES: "20"
      OCR_ALLOW_TESSERACT_FALLBACK: "1"
      TESS_LANG: eng
    ports:
      - "${AISERVICE_HOST_BIND:-127.0.0.1}:${AISERVICE_HOST_PORT:-8002}:8002"
    volumes:
      - aiservice_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
  prometheus_data:
  redis_data:
  aiservice_cache:

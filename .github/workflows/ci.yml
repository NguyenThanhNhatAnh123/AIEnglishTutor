name: CI

on:
  push:
    branches: ["main", "master", "develop", "codex/**"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile backend
        working-directory: backend
        run: mvn -q -DskipTests compile

  learningservice:
    name: Learning service compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile learningservice
        working-directory: learningservice
        run: mvn -q -DskipTests compile

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student, teacher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: Lint
        working-directory: frontend/${{ matrix.app }}
        run: npm run lint
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  aiservice:
    name: AI service import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: aiservice
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import app
        working-directory: aiservice
        run: python -c "import app"

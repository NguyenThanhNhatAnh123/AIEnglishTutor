name: CI

on:
  push:
    branches: ["main", "master", "develop", "codex/**"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn -q test

  learningservice:
    name: Learning service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test learningservice
        working-directory: learningservice
        run: mvn -q test

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student, teacher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: Run tests
        working-directory: frontend/${{ matrix.app }}
        run: npm run test
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  aiservice:
    name: AI service smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        working-directory: aiservice
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.115.5 uvicorn==0.32.0 python-multipart==0.0.17 Pillow==10.2.0
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: aiservice
        run: pytest

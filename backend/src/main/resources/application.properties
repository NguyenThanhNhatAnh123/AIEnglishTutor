spring.application.name=aienglishtutor

# Database
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/ai_english_exam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# Schema changes are managed through Flyway migrations; Hibernate only validates the mapped schema.
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${APP_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=${APP_FLYWAY_REPAIR:false}

# JWT
app.jwt.secret=8d9f2c7a1b5e4d6f9a2c3e7b1d4f6a8c9e2b5f7a1d3c6e8
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# FFmpeg (speaking uploads: normalize to MP3). Install ffmpeg + ffprobe on PATH or set full paths.
app.ffmpeg.binary=ffmpeg
app.ffprobe.binary=ffprobe

# OCR + TTS (image flow)
app.ocr.tesseract.binary=tesseract
app.ocr.tesseract.lang=eng
app.tts.espeak.binary=espeak

# DeepSeek AI scoring (teacher/student speaking-writing review)
app.ai.deepseek.api-key=sk-6be0e007fa594b3aa428e8c368472f8d
app.ai.deepseek.base-url=https://api.deepseek.com
app.ai.deepseek.model=deepseek-chat

# Logging
logging.level.com.ai.englishsystem=DEBUG
logging.level.org.springframework.security=WARN

# Security (BCrypt strength 10-12)
app.security.bcrypt-strength=12

# Server
server.port=8080

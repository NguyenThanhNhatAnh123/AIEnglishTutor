spring.application.name=aienglishtutor

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_english_exam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=myUltraSecretKeyThatMustBeAtLeast256BitsLongForHS256Algorithm!!
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Logging
logging.level.com.ai.englishsystem=DEBUG
logging.level.org.springframework.security=WARN

# Security (BCrypt strength 10-12)
app.security.bcrypt-strength=12

# Server
server.port=8080
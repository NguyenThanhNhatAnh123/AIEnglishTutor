spring.application.name=aienglishtutor

# =============================================================================
# DATABASE
# =============================================================================
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/ai_english_exam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${APP_DB_USERNAME:root}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# HIKARICP CONNECTION POOL
# =============================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.leak-detection-threshold=30000

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.transaction.default-timeout=30

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=false

# =============================================================================
# JWT
# =============================================================================
app.jwt.secret=${APP_JWT_SECRET:dev_only_replace_with_64_byte_secret_dev_only_replace_with_64_byte_secret}
app.jwt.expiration=3600000

# =============================================================================
# SERVER
# =============================================================================
server.port=8080
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=200

# =============================================================================
# FILE UPLOAD
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# =============================================================================
# AI SERVICE - DeepSeek
# =============================================================================
app.ai.deepseek.api-key=${APP_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=https://api.deepseek.com
app.ai.deepseek.model=deepseek-chat

# =============================================================================
# AI SERVICE - Whisper
# =============================================================================
app.ai.whisper.api-key=
app.ai.whisper.base-url=https://api.openai.com/v1
app.ai.whisper.model=whisper-1

# =============================================================================
# AI SERVICE - OCR.space
# =============================================================================
app.ocr.external.api-key=
app.ocr.external.base-url=https://api.ocr.space
app.ocr.external.language=eng

# =============================================================================
# AI LOCAL SERVICE
# =============================================================================
app.ai.local.base-url=${APP_AI_LOCAL_URL:http://127.0.0.1:8002}
app.ai.local.ocr.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ai.local.tts.base-url=${APP_AI_LOCAL_TTS_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ocr.local.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ai.local-transcribe.base-url=${APP_AI_LOCAL_TRANSCRIBE_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}

# =============================================================================
# HTTP CLIENT
# =============================================================================
app.ai.http.connect-timeout-seconds=15
app.ai.http.request-timeout-seconds=120
app.ai.http.total-timeout-seconds=170

# =============================================================================
# ASYNC THREAD POOL
# =============================================================================
app.ai.async.core-pool-size=5
app.ai.async.max-pool-size=20
app.ai.async.queue-capacity=100

# =============================================================================
# FFMPEG
# =============================================================================
app.ffmpeg.binary=ffmpeg
app.ffprobe.binary=ffprobe

# =============================================================================
# LOCAL TOOLS
# =============================================================================
app.ocr.tesseract.binary=tesseract
app.ocr.tesseract.lang=eng
app.tts.espeak.binary=espeak

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# =============================================================================
# MISC
# =============================================================================
spring.mvc.problemdetails.enabled=true
app.data.backfill-submission-attempts=false

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# =============================================================================
# SECURITY
# =============================================================================
app.security.bcrypt-strength=12

# =============================================================================
# RATE LIMIT / REDIS
# =============================================================================
app.rate-limit.backend=memory
app.rate-limit.ai.max-requests=30
app.rate-limit.ai.window-seconds=60
app.rate-limit.general.max-requests=200
app.rate-limit.general.window-seconds=60
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false

# =============================================================================
# LOGGING
# =============================================================================
logging.level.com.ai.englishsystem=INFO
logging.level.org.springframework.security=WARN

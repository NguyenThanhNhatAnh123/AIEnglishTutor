spring.application.name=aienglishtutor

# =============================================================================
# DATABASE
# =============================================================================
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/ai_english_exam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${APP_DB_USERNAME:root}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# HIKARICP CONNECTION POOL
# =============================================================================
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${APP_DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${APP_DB_POOL_TIMEOUT:10000}
spring.datasource.hikari.idle-timeout=${APP_DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${APP_DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${APP_DB_POOL_KEEPALIVE:180000}
spring.datasource.hikari.validation-timeout=${APP_DB_VALIDATION_TIMEOUT:2000}
spring.datasource.hikari.leak-detection-threshold=${APP_DB_LEAK_DETECTION_MS:30000}

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${APP_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.default_batch_fetch_size=${APP_JPA_BATCH_FETCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.transaction.default-timeout=${APP_TX_TIMEOUT_SECONDS:30}

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=${APP_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=${APP_FLYWAY_REPAIR:false}

# =============================================================================
# JWT
# =============================================================================
app.jwt.secret=${APP_JWT_SECRET:dev_only_replace_with_64_byte_secret_dev_only_replace_with_64_byte_secret}
app.jwt.expiration=3600000

# =============================================================================
# SERVER
# =============================================================================
server.port=${APP_SERVER_PORT:8080}
server.tomcat.threads.max=${APP_TOMCAT_THREADS:50}
server.tomcat.threads.min-spare=${APP_TOMCAT_MIN_THREADS:10}
server.tomcat.accept-count=${APP_TOMCAT_ACCEPT:100}
server.tomcat.max-connections=${APP_TOMCAT_MAX_CONN:200}
app.web.async.timeout-ms=${APP_WEB_ASYNC_TIMEOUT_MS:180000}

# =============================================================================
# FILE UPLOAD
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# =============================================================================
# AI SERVICE - DeepSeek
# =============================================================================
app.ai.deepseek.api-key=${APP_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=https://api.deepseek.com
app.ai.deepseek.model=deepseek-chat

# =============================================================================
# AI SERVICE - Whisper
# =============================================================================
app.ai.whisper.api-key=
app.ai.whisper.base-url=https://api.openai.com/v1
app.ai.whisper.model=whisper-1

# =============================================================================
# AI SERVICE - OCR.space
# =============================================================================
app.ocr.external.api-key=
app.ocr.external.base-url=https://api.ocr.space
app.ocr.external.language=eng

# =============================================================================
# AI LOCAL SERVICE
# =============================================================================
app.ai.local.base-url=${APP_AI_LOCAL_URL:http://127.0.0.1:8002}
app.ai.local.ocr.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ai.local.tts.base-url=${APP_AI_LOCAL_TTS_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ocr.local.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}
app.ai.local-transcribe.base-url=${APP_AI_LOCAL_TRANSCRIBE_URL:${APP_AI_LOCAL_URL:http://127.0.0.1:8002}}

# =============================================================================
# HTTP CLIENT
# =============================================================================
app.ai.http.connect-timeout-seconds=${APP_AI_CONNECT_TIMEOUT:15}
app.ai.http.request-timeout-seconds=${APP_AI_REQUEST_TIMEOUT:120}
app.ai.http.total-timeout-seconds=${APP_AI_TOTAL_TIMEOUT:170}
app.ai.ocr-json.timeout-seconds=${APP_AI_OCR_JSON_TIMEOUT:20}
app.ai.log.max-body-chars=${APP_AI_LOG_MAX_BODY_CHARS:12000}
app.ai.tts.max-text-chars=${APP_AI_TTS_MAX_TEXT_CHARS:5000}
app.ai.max-concurrent-requests=${APP_AI_MAX_CONCURRENT_REQUESTS:8}

# =============================================================================
# ASYNC THREAD POOL
# =============================================================================
app.ai.async.core-pool-size=${APP_AI_ASYNC_CORE:5}
app.ai.async.max-pool-size=${APP_AI_ASYNC_MAX:20}
app.ai.async.queue-capacity=${APP_AI_ASYNC_QUEUE:100}

# =============================================================================
# FFMPEG
# =============================================================================
app.ffmpeg.binary=ffmpeg
app.ffprobe.binary=ffprobe

# =============================================================================
# LOCAL TOOLS
# =============================================================================
app.ocr.tesseract.binary=tesseract
app.ocr.tesseract.lang=eng
app.tts.espeak.binary=espeak

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# =============================================================================
# MISC
# =============================================================================
spring.mvc.problemdetails.enabled=true
app.data.backfill-submission-attempts=false

# =============================================================================
# SPRING CACHE
# =============================================================================
spring.cache.type=${APP_CACHE_TYPE:simple}
spring.cache.cache-names=roles,teachers
app.cache.roles-ttl-seconds=3600
app.cache.teachers-ttl-seconds=300

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# =============================================================================
# SECURITY
# =============================================================================
app.security.bcrypt-strength=12

# =============================================================================
# RATE LIMIT / REDIS
# =============================================================================
app.rate-limit.backend=${APP_RATE_LIMIT_BACKEND:memory}
app.rate-limit.ai.max-requests=${APP_RATE_LIMIT_AI_MAX_REQUESTS:30}
app.rate-limit.ai.window-seconds=${APP_RATE_LIMIT_AI_WINDOW_SECONDS:60}
app.rate-limit.general.max-requests=${APP_RATE_LIMIT_GENERAL_MAX_REQUESTS:200}
app.rate-limit.general.window-seconds=${APP_RATE_LIMIT_GENERAL_WINDOW_SECONDS:60}
app.rate-limit.bypass-roles=${APP_RATE_LIMIT_BYPASS_ROLES:TEACHER}
spring.data.redis.host=${APP_REDIS_HOST:localhost}
spring.data.redis.port=${APP_REDIS_PORT:6379}
spring.data.redis.password=${APP_REDIS_PASSWORD:}
spring.data.redis.timeout=${APP_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

# =============================================================================
# LOGGING
# =============================================================================
logging.level.com.ai.englishsystem=INFO
logging.level.org.springframework.security=WARN

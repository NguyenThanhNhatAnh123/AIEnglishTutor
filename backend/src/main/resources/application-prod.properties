# Production overrides (activate with --spring.profiles.active=prod)
# Sensitive values should come from environment variables.

# Server
server.tomcat.threads.max=${APP_TOMCAT_THREADS:100}
server.tomcat.threads.min-spare=${APP_TOMCAT_MIN_THREADS:20}
server.tomcat.accept-count=${APP_TOMCAT_ACCEPT:200}
server.tomcat.max-connections=${APP_TOMCAT_MAX_CONN:500}
app.web.async.timeout-ms=${APP_WEB_ASYNC_TIMEOUT_MS:180000}

# Database
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${APP_DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${APP_DB_POOL_TIMEOUT:10000}
spring.datasource.hikari.keepalive-time=${APP_DB_POOL_KEEPALIVE:180000}
spring.datasource.hikari.validation-timeout=${APP_DB_VALIDATION_TIMEOUT:2000}
spring.datasource.hikari.leak-detection-threshold=${APP_DB_LEAK_DETECTION_MS:30000}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${APP_JPA_BATCH_SIZE:100}
spring.jpa.properties.hibernate.default_batch_fetch_size=${APP_JPA_BATCH_FETCH_SIZE:100}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.transaction.default-timeout=${APP_TX_TIMEOUT_SECONDS:30}

# Flyway
spring.flyway.enabled=true
spring.flyway.repair=false

# Logging
logging.level.com.ai.englishsystem=${APP_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${APP_SECURITY_LOG_LEVEL:WARN}

# File upload
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_SIZE:10MB}
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Security
app.security.bcrypt-strength=${APP_BCRYPT_STRENGTH:12}
app.jwt.expiration=${APP_JWT_EXPIRATION:1800000}
app.jwt.secret=${APP_JWT_SECRET}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088,http://localhost,http://127.0.0.1}

# AI providers
app.ai.deepseek.api-key=${APP_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=${APP_DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.deepseek.model=${APP_DEEPSEEK_MODEL:deepseek-chat}
app.ai.whisper.api-key=${APP_WHISPER_API_KEY:}
app.ai.whisper.base-url=${APP_WHISPER_BASE_URL:https://api.openai.com/v1}
app.ai.whisper.model=${APP_WHISPER_MODEL:whisper-1}
app.ocr.external.api-key=${APP_OCR_SPACE_API_KEY:}
app.ocr.external.base-url=${APP_OCR_SPACE_BASE_URL:https://api.ocr.space}
app.ocr.external.language=${APP_OCR_LANGUAGE:eng}
app.ai.local.base-url=${APP_AI_LOCAL_URL:}
app.ai.local.ocr.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:}}
app.ai.local.tts.base-url=${APP_AI_LOCAL_TTS_URL:${APP_AI_LOCAL_URL:}}
app.ocr.local.base-url=${APP_AI_LOCAL_OCR_URL:${APP_AI_LOCAL_URL:}}
app.ai.local-transcribe.base-url=${APP_AI_LOCAL_TRANSCRIBE_URL:${APP_AI_LOCAL_URL:}}
app.ai.http.connect-timeout-seconds=${APP_AI_CONNECT_TIMEOUT:15}
app.ai.http.request-timeout-seconds=${APP_AI_REQUEST_TIMEOUT:120}
app.ai.http.total-timeout-seconds=${APP_AI_TOTAL_TIMEOUT:170}
app.ai.ocr-json.timeout-seconds=${APP_AI_OCR_JSON_TIMEOUT:20}
app.ai.log.max-body-chars=${APP_AI_LOG_MAX_BODY_CHARS:12000}
app.ai.tts.max-text-chars=${APP_AI_TTS_MAX_TEXT_CHARS:5000}

# FFmpeg
app.ffmpeg.binary=${APP_FFMPEG_BINARY:ffmpeg}
app.ffprobe.binary=${APP_FFPROBE_BINARY:ffprobe}

# Rate limit / Redis
app.rate-limit.backend=${APP_RATE_LIMIT_BACKEND:redis}
app.rate-limit.ai.max-requests=${APP_RATE_LIMIT_AI_MAX_REQUESTS:30}
app.rate-limit.ai.window-seconds=${APP_RATE_LIMIT_AI_WINDOW_SECONDS:60}
app.rate-limit.general.max-requests=${APP_RATE_LIMIT_GENERAL_MAX_REQUESTS:200}
app.rate-limit.general.window-seconds=${APP_RATE_LIMIT_GENERAL_WINDOW_SECONDS:60}
spring.data.redis.host=${APP_REDIS_HOST:redis}
spring.data.redis.port=${APP_REDIS_PORT:6379}
spring.data.redis.password=${APP_REDIS_PASSWORD:}
spring.data.redis.timeout=${APP_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

# Observability
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=${APP_MANAGEMENT_EXPOSURE:health,info,metrics,prometheus}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  upstream backend_upstream {
    server backend:8080;
    keepalive 32;
  }

  upstream learning_upstream {
    server learningservice:8081;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/learning/ {
      proxy_pass http://learning_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 210s;
      proxy_send_timeout 210s;
    }

    location /uploads/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 210s;
    }

    location = /actuator/health {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
    }

    location = /actuator/prometheus {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
    }

    location = /learning/actuator/health {
      proxy_pass http://learning_upstream/actuator/health;
      proxy_set_header Host $host;
    }

    location = / {
      return 302 /student/;
    }

    location = /student {
      return 301 /student/;
    }

    location /student/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /student/index.html =404;
    }

    location = /teacher {
      return 301 /teacher/;
    }

    location /teacher/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /teacher/index.html =404;
    }
  }
}
